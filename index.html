<!doctype html>
<!--
  index.html — the page layout.
  Top: the emergency banner (always visible, can't be closed).
  Middle: the map.
  Bottom: a panel with the inputs and, after a run, the "Check these first" list.
  The words on screen are filled in by i18n.js (look for data-i18n="..."), so there is
  no visible text written here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b00020">
  <title>FindThem</title>
  <!-- Lets phones install FindThem like an app, with its icon. -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Emergency banner: a tap-to-call link. The number depends on the phone's region. -->
  <header id="banner">
    <a id="call-link" href="tel:911"><span id="call-text">CALL 911 FIRST</span></a>
    <!-- Shown only when the phone has no signal. -->
    <p id="offline-banner" role="status" hidden data-i18n="offlineBanner"></p>
  </header>

  <main id="map-wrap">
    <div id="map" role="application" data-i18n-aria="lastSeenTitle"></div>
    <!-- Short messages ("Loading streets…", errors). Screen readers read them out. -->
    <div id="status" role="status" aria-live="polite" hidden></div>

    <!-- Shown while the next map tap places something ("Tap the map where they were last seen"). -->
    <div id="tap-banner" hidden>
      <p id="tap-banner-text" role="status" aria-live="polite"></p>
      <button id="tap-banner-search" type="button" data-i18n-aria="searchMap"><svg class="icon-search" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button id="tap-banner-cancel" type="button" data-i18n="cancel"></button>
    </div>

    <!-- Map search (the magnifying glass): find an address or place by name. -->
    <div id="search-box" hidden>
      <form id="search-form" role="search">
        <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
               data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchMap">
        <button id="search-go" type="submit" data-i18n-aria="searchMap"><svg class="icon-search" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
        <button id="search-close" type="button" data-i18n-aria="close">✕</button>
      </form>
      <p id="search-msg" role="status" aria-live="polite" hidden></p>
      <ul id="search-results"></ul>
    </div>

    <!-- Loading bar while streets download and the engine runs. -->
    <div id="progress" hidden>
      <p id="progress-text" role="status" aria-live="polite"></p>
      <div class="progress-track"><div id="progress-fill"></div></div>
    </div>

    <!-- What the colors mean. Shown after a prediction. -->
    <div id="legend" hidden role="button" tabindex="0" aria-expanded="true">
      <p class="legend-title" data-i18n="legendTitle"></p>
      <p><span class="swatch red"></span><span data-i18n="legendRed"></span></p>
      <p><span class="swatch orange"></span><span data-i18n="legendOrange"></span></p>
      <p><span class="swatch yellow"></span><span data-i18n="legendYellow"></span></p>
      <p><span class="swatch purple"></span><span data-i18n="legendStreets"></span></p>
      <p><span class="swatch teal"></span><span data-i18n="legendSearchers"></span></p>
    </div>
  </main>

  <section id="panel">
    <button id="panel-toggle" class="panel-handle" type="button" aria-expanded="true" data-i18n="hidePanel"></button>

    <div id="panel-body">
      <!-- Step 0 and 1: call emergency services, then check the house. Collapses once a search runs. -->
      <details id="first-steps" open>
        <summary data-i18n="firstSteps"></summary>
        <a id="call-button" class="call-button" href="tel:911"></a>
        <p data-i18n="call911Tell"></p>
        <ul class="script">
          <li data-i18n="script_dementia"></li>
          <li data-i18n="script_who"></li>
          <li data-i18n="script_clothes"></li>
          <li data-i18n="script_lastSeen"></li>
          <li data-i18n="script_medical"></li>
          <li data-i18n="script_phone"></li>
        </ul>
        <h3 data-i18n="houseTitle"></h3>
        <p class="help" data-i18n="houseHint"></p>
        <ul class="checklist">
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_closets"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_beds"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_bathrooms"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_garage"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_cars"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_yard"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_neighbors"></span></label></li>
        </ul>
      </details>

      <!-- Results: hidden until the first run. -->
      <div id="results" hidden>
        <!-- The person was found: shown on every phone of the search; the tasks are then hidden. -->
        <div id="found-banner" class="found-banner" role="alert" hidden></div>
        <h2 data-i18n="checkFirst"></h2>
        <ol id="spots"></ol>
        <button id="more-spots" class="link-button" type="button" hidden></button>
        <p class="note" data-i18n="guideNote"></p>

        <!-- Sharing: one link puts every searcher on the same live map. -->
        <div id="share-box" class="sub-form">
          <label for="my-name" data-i18n="yourName"></label>
          <input id="my-name" type="text" maxlength="40" autocomplete="given-name">
          <p class="help" data-i18n="yourNameHint"></p>
          <p class="help" data-i18n="locationSharedNote"></p>
          <button id="share" class="big primary" type="button" data-i18n="shareSearch"></button>
          <p id="live-status" class="note" role="status"></p>
          <!-- Shown when this search was started on another version of the map engine. -->
          <p id="version-warning" class="note warn" role="alert" hidden data-i18n="versionMismatch"></p>
          <input id="share-link" type="text" readonly hidden data-i18n-aria="copyThisLink">
        </div>

        <!-- Search leader: one short, fixed sentence (replies.js templates; no AI writes it). -->
        <div id="leader" class="leader" hidden>
          <strong data-i18n="leaderLabel"></strong>
          <p id="leader-line" class="leader-line" aria-live="polite"></p>
          <div id="leader-warnings" class="leader-warnings" role="alert" hidden></div>
        </div>

        <!-- Report box: type or speak a report; it fills in the sighting form or a message,
             and nothing is added until the person checks it and taps the button. -->
        <button id="report-open" class="big" type="button" aria-expanded="false" data-i18n="reportOpen"></button>
        <div id="report-box" class="sub-form" hidden>
          <p class="help" data-i18n="reportHint"></p>
          <label for="report-text" data-i18n="reportLabel"></label>
          <textarea id="report-text" rows="3" maxlength="1000"></textarea>
          <div class="row">
            <button id="report-voice" class="big" type="button" aria-pressed="false" data-i18n="reportSpeak"></button>
            <button id="report-read" class="big primary" type="button" data-i18n="reportRead"></button>
          </div>
          <p id="report-status" class="help" role="status"></p>
          <!-- Safety warnings read from the report (water, vehicle, emergency...). Never auto-hidden. -->
          <div id="report-flags" class="flags" role="alert" hidden></div>
          <p class="note" data-i18n="reportPrivacy"></p>
        </div>

        <!-- Sighting: tap the map, fill in the form, and the map updates. -->
        <button id="report-sighting" class="big" type="button" aria-pressed="false" data-i18n="sightingStart"></button>
        <div id="sighting-form" class="sub-form" hidden>
          <div id="sighting-flags" class="flags" role="alert" hidden></div>
          <p id="sighting-check" class="note warn" hidden data-i18n="reportCheck"></p>
          <p id="sighting-where" class="help" data-i18n="tapSighting"></p>
          <label for="sighting-minutes" data-i18n="sightingMinutes"></label>
          <input id="sighting-minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" value="0">
          <label for="sighting-direction" data-i18n="sightingDirection"></label>
          <select id="sighting-direction"></select>
          <fieldset>
            <legend data-i18n="sightingSure"></legend>
            <label class="choice"><input type="radio" name="sure" value="0.3"> <span data-i18n="sure_low"></span></label>
            <label class="choice"><input type="radio" name="sure" value="0.6" checked> <span data-i18n="sure_mid"></span></label>
            <label class="choice"><input type="radio" name="sure" value="0.9"> <span data-i18n="sure_high"></span></label>
          </fieldset>
          <label for="sighting-note" data-i18n="sightingNote"></label>
          <input id="sighting-note" type="text" maxlength="200">
          <button id="sighting-save" class="big primary" type="button" data-i18n="sightingSave"></button>
          <button id="sighting-cancel" class="big" type="button" data-i18n="cancel"></button>
        </div>

        <!-- Your next task: up to three ranked routes from the search planner (engine/planner),
             each with its warnings. Taking one tells the others, so nobody doubles up. -->
        <h2 data-i18n="tasksTitle"></h2>
        <p class="help" data-i18n="tasksHint"></p>
        <p id="task-note" class="help" hidden></p>
        <ol id="areas"></ol>
        <ul id="unfilled" class="unfilled" hidden></ul>
        <p id="plan-measures" class="help" hidden></p>
        <!-- Always there during a search: ends it for everyone and drops a pin. -->
        <button id="found-button" class="big found" type="button" data-i18n="foundButton"></button>

        <!-- Messages between everyone on the search (an event of type 'message'). -->
        <h2 data-i18n="messagesTitle"></h2>
        <ol id="messages"></ol>
        <div id="message-flags" class="flags" role="alert" hidden></div>
        <div class="row message-row">
          <input id="message-text" type="text" maxlength="300" data-i18n-placeholder="messagePlaceholder" data-i18n-aria="messagesTitle">
          <button id="message-send" class="big" type="button" data-i18n="send"></button>
        </div>

        <button id="handoff" class="big" type="button" data-i18n="handoffButton"></button>
      </div>

      <!-- What you know: numbered steps. Folds up after Find (tap the title to change something). -->
      <details id="case-inputs" open>
      <summary><span data-i18n="caseInputsTitle"></span> <span id="case-recap" class="recap"></span></summary>
      <h2 class="step" data-i18n="lastSeenTitle"></h2>
      <button id="set-last-seen" class="big" type="button" aria-pressed="false"></button>
      <p id="last-seen-done" class="done-note" hidden data-i18n="lastSeenDone"></p>

      <label for="minutes" class="step" data-i18n="minutesLabel"></label>
      <input id="minutes" type="number" inputmode="numeric" min="1" max="1440" step="1">

      <!-- Direction: turned with the arrow on the map. The hidden dropdown just holds the value. -->
      <p class="field-label step" data-i18n="directionLabel"></p>
      <div class="row direction-row">
        <span id="direction-pill" class="pill"></span>
        <button id="direction-unknown" class="small" type="button" data-i18n="dirDontKnow"></button>
      </div>
      <p id="direction-help" class="help"></p>
      <select id="direction" hidden></select>

      <fieldset id="mobility">
        <legend class="step" data-i18n="mobilityLabel"></legend>
        <label class="choice"><input type="radio" name="mobility" value="normal" checked> <span data-i18n="mob_normal"></span></label>
        <label class="choice"><input type="radio" name="mobility" value="slow"> <span data-i18n="mob_slow"></span></label>
        <label class="choice"><input type="radio" name="mobility" value="walker"> <span data-i18n="mob_walker"></span></label>
      </fieldset>

      <fieldset id="familiar">
        <legend class="step" data-i18n="familiarLabel"></legend>
        <p class="help" data-i18n="familiarHint"></p>
        <ul id="familiar-list"></ul>
        <button id="add-familiar" class="big" type="button" aria-pressed="false"></button>
      </fieldset>

      <button id="run" class="big primary" type="button" data-i18n="run"></button>
      </details>

      <div class="row">
        <button id="demo" class="big" type="button" data-i18n="demo"></button>
        <select id="language" data-i18n-aria="language"></select>
        <button id="units" class="big" type="button" data-i18n-aria="units">mi</button>
      </div>

      <!-- Before an emergency: download the streets around home so they work offline. -->
      <details id="home-area">
        <summary data-i18n="homeTitle"></summary>
        <p class="help" data-i18n="homeHint"></p>
        <label for="home-address" data-i18n="homeAddress"></label>
        <div class="row">
          <input id="home-address" type="text" autocomplete="street-address">
          <button id="home-find" class="big" type="button" data-i18n="homeFind"></button>
        </div>
        <div class="row">
          <button id="home-tap" class="big" type="button" aria-pressed="false" data-i18n="homeTap"></button>
          <button id="home-gps" class="big" type="button" data-i18n="homeGps"></button>
        </div>
        <button id="home-save" class="big primary" type="button" data-i18n="homeSave"></button>
        <p id="home-status" class="help" role="status"></p>
      </details>
    </div>
  </section>

  <!-- The police hand-off sheet: plain text to copy, share or print. -->
  <dialog id="handoff-dialog">
    <pre id="handoff-text"></pre>
    <div class="row">
      <button id="handoff-copy" class="big" type="button" data-i18n="copy"></button>
      <button id="handoff-print" class="big" type="button" data-i18n="print"></button>
      <button id="handoff-close" class="big" type="button" data-i18n="close"></button>
    </div>
  </dialog>

  <!-- Libraries (stored in /lib, not loaded from the internet), then our code. -->
  <script src="lib/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
