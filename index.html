<!doctype html>
<!--
  index.html — the page layout.
  Top: the emergency banner (always visible, can't be closed).
  Middle: the map.
  Bottom: a panel with the inputs and, after a run, the "Check these first" list.
  The words on screen are filled in by i18n.js (look for data-i18n="..."), so there is
  no visible text written here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b00020">
  <title>FindThem</title>
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Emergency banner: a tap-to-call link. The number depends on the phone's region. -->
  <header id="banner">
    <a id="call-link" href="tel:911"><span id="call-text">CALL 911 FIRST</span></a>
  </header>

  <main id="map-wrap">
    <div id="map" role="application" data-i18n-aria="lastSeenTitle"></div>
    <!-- Short messages ("Loading streets…", errors). Screen readers read them out. -->
    <div id="status" role="status" aria-live="polite" hidden></div>
  </main>

  <section id="panel">
    <button id="panel-toggle" class="panel-handle" type="button" aria-expanded="true" data-i18n="hidePanel"></button>

    <div id="panel-body">
      <!-- Step 0 and 1: call emergency services, then check the house. Collapses once a search runs. -->
      <details id="first-steps" open>
        <summary data-i18n="firstSteps"></summary>
        <a id="call-button" class="call-button" href="tel:911"></a>
        <p data-i18n="call911Tell"></p>
        <ul class="script">
          <li data-i18n="script_dementia"></li>
          <li data-i18n="script_who"></li>
          <li data-i18n="script_clothes"></li>
          <li data-i18n="script_lastSeen"></li>
          <li data-i18n="script_medical"></li>
          <li data-i18n="script_phone"></li>
        </ul>
        <h3 data-i18n="houseTitle"></h3>
        <p class="help" data-i18n="houseHint"></p>
        <ul class="checklist">
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_closets"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_beds"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_bathrooms"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_garage"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_cars"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_yard"></span></label></li>
          <li><label class="choice"><input type="checkbox"> <span data-i18n="check_neighbors"></span></label></li>
        </ul>
      </details>

      <!-- Results: hidden until the first run. -->
      <div id="results" hidden>
        <h2 data-i18n="checkFirst"></h2>
        <p id="fake-note" class="note warn" hidden data-i18n="fakeEngine"></p>
        <ol id="spots"></ol>
        <button id="more-spots" class="link-button" type="button" hidden></button>
        <p class="note" data-i18n="guideNote"></p>

        <!-- Sighting: tap the map, fill in the form, and the map updates. -->
        <button id="report-sighting" class="big" type="button" aria-pressed="false" data-i18n="sightingStart"></button>
        <div id="sighting-form" class="sub-form" hidden>
          <p id="sighting-where" class="help" data-i18n="tapSighting"></p>
          <label for="sighting-minutes" data-i18n="sightingMinutes"></label>
          <input id="sighting-minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" value="0">
          <label for="sighting-direction" data-i18n="sightingDirection"></label>
          <select id="sighting-direction"></select>
          <fieldset>
            <legend data-i18n="sightingSure"></legend>
            <label class="choice"><input type="radio" name="sure" value="0.3"> <span data-i18n="sure_low"></span></label>
            <label class="choice"><input type="radio" name="sure" value="0.6" checked> <span data-i18n="sure_mid"></span></label>
            <label class="choice"><input type="radio" name="sure" value="0.9"> <span data-i18n="sure_high"></span></label>
          </fieldset>
          <label for="sighting-note" data-i18n="sightingNote"></label>
          <input id="sighting-note" type="text" maxlength="200">
          <button id="sighting-save" class="big primary" type="button" data-i18n="sightingSave"></button>
          <button id="sighting-cancel" class="big" type="button" data-i18n="cancel"></button>
        </div>

        <!-- Next areas: sectors chosen by the engine, each with a walking route. -->
        <h2 data-i18n="nextAreasTitle"></h2>
        <p class="help" data-i18n="nextAreasHint"></p>
        <ol id="areas"></ol>
      </div>

      <h2 data-i18n="lastSeenTitle"></h2>
      <button id="set-last-seen" class="big" type="button" aria-pressed="false" data-i18n="setLastSeen"></button>
      <p id="last-seen-help" class="help" data-i18n="tapLastSeen"></p>

      <label for="minutes" data-i18n="minutesLabel"></label>
      <input id="minutes" type="number" inputmode="numeric" min="1" max="1440" step="1">

      <label for="direction" data-i18n="directionLabel"></label>
      <select id="direction"></select>

      <fieldset id="mobility">
        <legend data-i18n="mobilityLabel"></legend>
        <label class="choice"><input type="radio" name="mobility" value="normal" checked> <span data-i18n="mob_normal"></span></label>
        <label class="choice"><input type="radio" name="mobility" value="slow"> <span data-i18n="mob_slow"></span></label>
        <label class="choice"><input type="radio" name="mobility" value="walker"> <span data-i18n="mob_walker"></span></label>
      </fieldset>

      <fieldset id="familiar">
        <legend data-i18n="familiarLabel"></legend>
        <p class="help" data-i18n="familiarHint"></p>
        <ul id="familiar-list"></ul>
        <button id="add-familiar" class="big" type="button" aria-pressed="false" data-i18n="addFamiliar"></button>
      </fieldset>

      <button id="run" class="big primary" type="button" data-i18n="run"></button>

      <div class="row">
        <button id="demo" class="big" type="button" data-i18n="demo"></button>
        <select id="language" data-i18n-aria="language"></select>
        <button id="units" class="big" type="button" data-i18n-aria="units">mi</button>
      </div>
    </div>
  </section>

  <!-- Libraries (stored in /lib, not loaded from the internet), then our code. -->
  <script src="lib/leaflet.js"></script>
  <script src="lib/leaflet-heat.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
