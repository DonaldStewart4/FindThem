# Cloudflare Worker settings for the FindThem LLM proxy.
# NO SECRETS HERE. The Jev (TypeSafe) key is set with: wrangler secret put TYPESAFE_API_KEY
name = "findthem-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# The website's address (no trailing slash), e.g. "https://benstew.github.io".
# "*" allows any site; set the real one before the demo.
ALLOWED_ORIGIN = "*"
